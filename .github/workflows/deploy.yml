# Hosting PHP/MySQL: tạo artifact để upload lên hosting, không deploy lên GitHub Pages.
name: Package PHP hosting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: node tools/package-hosting.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: php-mysql-hosting
          path: dist
          include-hidden-files: true
