name: Tests (PHP + MySQL)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Node 26 làm tiến trình tải trình duyệt của Playwright 1.56 treo vô hạn -> dùng Node 24 (.nvmrc) và đặt giới hạn thời gian
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run db:seed
      - run: docker compose up -d --build --wait
      - name: PHP syntax
        run: docker compose exec -T web sh -c 'find server -name "*.php" -exec php -l {} \;'
      - run: docker compose exec -T web php server/cli.php seed
      - run: npm run test:unit
      - run: npm run test:pricing:php
      - run: npm run test:api
        env:
          TEST_ADMIN_PHONE: "0912345698"
      - run: docker compose exec -T web php tests/server/admin.test.php
      - run: docker compose exec -T web php server/cli.php admin 0912345698
      - run: npm run test:hosting
        env:
          TEST_ADMIN_PHONE: "0912345698"
          TEST_ADMIN_PASSWORD: "MysqlTest!2026"
      - run: npm run test:browser
      - name: SEO build using MySQL
        run: npm run build -- --backend http://127.0.0.1:8080/server/api.php --limit 3
      - run: npm run test:build
      - name: Docker logs
        if: failure()
        run: docker compose logs
      - name: Stop local services
        if: always()
        run: docker compose down
