services:
  web:
    build: ./server
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: development
      RATE_LIMIT_MULTIPLIER: "10"
      DB_HOST: mysql
      DB_NAME: dien_lanh
      DB_USER: dien_lanh
      DB_PASSWORD: local-development-only
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: dien_lanh
      MYSQL_USER: dien_lanh
      MYSQL_PASSWORD: local-development-only
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Kiểm tra qua TCP (127.0.0.1): MySQL chạy bản tạm khi khởi tạo chỉ mở socket nội bộ,
      # ping qua "localhost" (socket) báo sẵn sàng quá sớm rồi máy chủ tắt để khởi động lại.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
